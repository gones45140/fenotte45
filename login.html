<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GONES45 — Connexion</title>
  <style>
    :root {
      --bg: #0a0e1a; --box: rgba(255,255,255,.05); --border: rgba(255,255,255,.1);
      --t1: #fff; --t2: #b8c4d8; --t3: #8899aa; --a: #4d84ff; --g: #2ecc71; --r: #ff6b6b;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: var(--bg); color: var(--t1); margin: 0;
      display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;
    }
    .box {
      background: var(--box); border: 1px solid var(--border); border-radius: 14px;
      padding: 32px 28px; max-width: 380px; width: 100%;
    }
    h1 { margin: 0 0 6px; font-size: 24px; letter-spacing: -.5px; }
    .sub { font-size: 12px; color: var(--t3); margin-bottom: 22px; line-height: 1.6; }
    label { font-size: 10px; color: var(--t2); text-transform: uppercase; letter-spacing: .8px; font-weight: 700; }
    input {
      width: 100%; background: rgba(0,0,0,.3); border: 1px solid var(--border);
      border-radius: 9px; color: var(--t1); padding: 12px 14px; font-size: 14px;
      margin: 6px 0 14px; outline: none;
    }
    input:focus { border-color: var(--a); }
    button {
      width: 100%; background: var(--a); border: none; border-radius: 9px;
      color: white; padding: 12px; font-size: 14px; font-weight: 700; cursor: pointer;
      transition: opacity .15s;
    }
    button:disabled { opacity: .5; cursor: wait; }
    .msg { font-size: 12px; margin-top: 14px; text-align: center; line-height: 1.6; min-height: 32px; }
    .msg.ok { color: var(--g); }
    .msg.err { color: var(--r); }
  </style>
</head>
<body>
  <div class="box">
    <h1>🎯 GONES45</h1>
    <div class="sub">Connexion sans mot de passe. Un lien de connexion t'est envoyé par email.</div>

    <label>Email</label>
    <input type="email" id="email" placeholder="ton@email.com" autocomplete="email" required>
    <button id="btn">Envoyer le lien</button>

    <div class="msg" id="msg"></div>
  </div>

  <script type="module">
    import { envoyerMagicLink, utilisateurActuel } from './supabase.js';

    // Si déjà connecté, on va direct à l'app
    const user = await utilisateurActuel();
    if (user) window.location.href = './index.html';

    const btn = document.getElementById('btn');
    const email = document.getElementById('email');
    const msg = document.getElementById('msg');

    email.focus();
    email.addEventListener('keydown', e => { if (e.key === 'Enter') btn.click(); });

    btn.onclick = async () => {
      const val = email.value.trim();
      if (!val || !val.includes('@')) {
        msg.className = 'msg err'; msg.textContent = 'Email invalide.'; return;
      }
      btn.disabled = true;
      btn.textContent = '⏳ Envoi…';
      msg.className = 'msg'; msg.textContent = '';
      const err = await envoyerMagicLink(val);
      if (err) {
        msg.className = 'msg err';
        msg.textContent = '❌ ' + (err.message || 'Erreur inconnue');
        btn.disabled = false; btn.textContent = 'Envoyer le lien';
      } else {
        msg.className = 'msg ok';
        msg.innerHTML = '✅ Regarde ta boîte mail !<br>Le lien te connecte directement.';
      }
    };
  </script>
</body>
</html>
