<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GONES45</title>
<!-- APPLI INSTALLABLE (28/09/2026, préparation de l'APK « TWA » via PWABuilder) :
     le manifeste n'était déclaré sur aucune page de bet45, et son icône venait
     d'un site extérieur. sw.js (réseau d'abord, jamais de vieux cache) est
     enregistré dès l'ouverture : exigé pour l'installation et les notifications. -->
<link rel="manifest" href="manifest.json?v=20260928h">
<meta name="theme-color" content="#0a0e1a">
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</head>
<body style="background:#0a0e1a">
<!-- Redirection vers l'application.
     ATTENTION : ne PAS utiliser de redirection par meta refresh ici.
     Le magic link Supabase arrive sur ce dossier avec un ?code=... (flux PKCE)
     ou un #access_token=... (flux implicite). Un meta refresh JETTE la query
     string et le fragment : auth-guard.js ne verrait aucune session et
     renverrait vers login.html en boucle.
     location.replace conserve les deux, et n'ajoute pas d'entree dans
     l'historique (pas de retour arriere piegeux).

     AJOUT DU 31/08 (page vitrine, demande d'Antoine) : un visiteur SANS
     parametre d'authentification (jamais venu, ou venu depuis un lien
     partage) tombe desormais sur accueil.html plutot que directement sur
     l'appli — pour lui expliquer ce qu'est BET45 avant de le laisser entrer.
     Un lien magique en cours (?code= ou #access_token=) continue de filer
     DIRECTEMENT vers indexfenotte.html, sans jamais passer par accueil.html :
     casser ce chemin casserait la connexion, aucune page vitrine ne doit
     s'interposer sur ce cas precis. -->
<script>
  var aUnCode = /[?&]code=/.test(window.location.search) || /access_token=/.test(window.location.hash);
  var cible = aUnCode ? './indexfenotte.html' : './accueil.html';
  location.replace(cible + window.location.search + window.location.hash);
</script>
<noscript>
  <p style="color:#fff;font-family:system-ui;padding:20px">
    Activez JavaScript, ou ouvrez directement
    <a href="./indexfenotte.html" style="color:#7aa7ff">indexfenotte.html</a>.
  </p>
</noscript>
</body>
</html>
