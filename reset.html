<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GONES45 — Nouveau mot de passe</title>
  <style>
    :root {
      --bg: #0a0e1a; --box: rgba(255,255,255,.05); --border: rgba(255,255,255,.1);
      --t1: #fff; --t2: #b8c4d8; --t3: #8899aa; --a: #4d84ff; --g: #2ecc71; --r: #ff6b6b;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: var(--bg); color: var(--t1); margin: 0;
      display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;
    }
    .box {
      background: var(--box); border: 1px solid var(--border); border-radius: 14px;
      padding: 32px 28px; max-width: 380px; width: 100%;
    }
    h1 { margin: 0 0 6px; font-size: 24px; letter-spacing: -.5px; }
    .sub { font-size: 12px; color: var(--t3); margin-bottom: 22px; line-height: 1.6; }
    label { font-size: 10px; color: var(--t2); text-transform: uppercase; letter-spacing: .8px; font-weight: 700; }
    input {
      width: 100%; background: rgba(0,0,0,.3); border: 1px solid var(--border);
      border-radius: 9px; color: var(--t1); padding: 12px 14px; font-size: 14px;
      margin: 6px 0 14px; outline: none;
    }
    input:focus { border-color: var(--a); }
    button {
      width: 100%; background: var(--a); border: none; border-radius: 9px;
      color: white; padding: 12px; font-size: 14px; font-weight: 700; cursor: pointer;
      transition: opacity .15s;
    }
    button:disabled { opacity: .5; cursor: wait; }
    .msg { font-size: 12px; margin-top: 14px; text-align: center; line-height: 1.6; min-height: 32px; }
    .msg.ok { color: var(--g); }
    .msg.err { color: var(--r); }
    .form { display: none; }
    .form.visible { display: block; }
    .loading { text-align: center; color: var(--t3); font-size: 13px; padding: 10px 0; }
    a { color: var(--a); }
  </style>
</head>
<body>
  <div class="box">
    <h1>🎯 GONES45</h1>
    <div id="loading" class="loading">Validation du lien…</div>
    <div id="form" class="form">
      <div class="sub">Choisis ton mot de passe. Toutes tes prochaines connexions se feront avec email + ce mot de passe, sans lien.</div>
      <label>Nouveau mot de passe</label>
      <input type="password" id="pass1" placeholder="8 caractères minimum" autocomplete="new-password" required>
      <label>Confirmer</label>
      <input type="password" id="pass2" placeholder="Retape le même" autocomplete="new-password" required>
      <button id="btn">Enregistrer</button>
      <div class="msg" id="msg"></div>
    </div>
  </div>

  <script type="module">
    import { supabase, definirNouveauMotDePasse } from './supabase.js';

    /* Le lien recu par email etablit une session de type "recovery" — meme
       format que le magic link (hash #access_token=... ou ?code=... selon la
       config Supabase). On reprend la meme detection qu'ailleurs dans le
       projet (auth-guard.js) plutot que de se fier a getSession() seul, qui
       peut repondre trop tot pour le flux PKCE. */
    async function attendreSession() {
      const hash = window.location.hash || '';
      const search = window.location.search || '';
      const contientToken = /access_token=|error/.test(hash) || /[?&]code=/.test(search);
      if (!contientToken) {
        const { data: { session } } = await supabase.auth.getSession();
        return session;
      }
      if (/[?&]code=/.test(search)) {
        try {
          const { data, error } = await supabase.auth.exchangeCodeForSession(window.location.href);
          if (error) throw error;
          return data && data.session;
        } catch (e) {
          console.error('échange du code échoué :', e);
          return null;
        }
      }
      return await new Promise(resolve => {
        let done = false;
        const { data: { subscription } } = supabase.auth.onAuthStateChange((event, session) => {
          if (done) return;
          if (session) { done = true; subscription.unsubscribe(); resolve(session); }
        });
        setTimeout(async () => {
          if (done) return;
          done = true; subscription.unsubscribe();
          const { data: { session } } = await supabase.auth.getSession();
          resolve(session);
        }, 4000);
      });
    }

    const session = await attendreSession();
    const loading = document.getElementById('loading');
    const form = document.getElementById('form');

    if (!session) {
      loading.innerHTML = '<span style="color:var(--r);">❌ Lien invalide ou expiré.</span><br><br>'
        + '<a href="./login.html">Redemander un lien</a>';
      throw new Error('pas de session de récupération');
    }

    loading.style.display = 'none';
    form.classList.add('visible');

    const btn = document.getElementById('btn');
    const pass1 = document.getElementById('pass1');
    const pass2 = document.getElementById('pass2');
    const msg = document.getElementById('msg');
    pass1.focus();
    pass2.addEventListener('keydown', e => { if (e.key === 'Enter') btn.click(); });

    btn.onclick = async () => {
      const p1 = pass1.value, p2 = pass2.value;
      if (p1.length < 8) { msg.className = 'msg err'; msg.textContent = '8 caractères minimum.'; return; }
      if (p1 !== p2) { msg.className = 'msg err'; msg.textContent = 'Les deux mots de passe ne correspondent pas.'; return; }
      btn.disabled = true; btn.textContent = '⏳ Enregistrement…';
      msg.className = 'msg'; msg.textContent = '';
      const err = await definirNouveauMotDePasse(p1);
      if (err) {
        msg.className = 'msg err';
        msg.textContent = '❌ ' + (err.message || 'Erreur inconnue');
        btn.disabled = false; btn.textContent = 'Enregistrer';
      } else {
        msg.className = 'msg ok';
        msg.textContent = '✅ Mot de passe enregistré. Redirection…';
        setTimeout(() => { window.location.href = './index.html'; }, 1200);
      }
    };
  </script>
</body>
</html>
